name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck:tooling
      - run: npm run check:migration
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:browser
      - name: Build a clean installed content consumer
        run: npm run test:installed
      - name: Install software WebGPU presentation dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Demonstrate browser assertion failure detection
        env:
          NGNE_BROWSER_HEADLESS: 0
          NGNE_WEBGPU_ADAPTER: swiftshader
        run: |
          if NGNE_BROWSER_INJECT_FAILURE=1 NGNE_BROWSER_ARTIFACT_DIR=.test-output/browser-intentional-failure xvfb-run -a npm run test:browser; then
            echo "Intentional browser assertion unexpectedly passed"
            exit 1
          fi
          jq -e '.failures[] | contains("intentional CI assertion failure")' .test-output/browser-intentional-failure/results.json
          jq -e '.status == "failed" and ([.cleanup[].status] | all(. == "passed"))' .test-output/browser-intentional-failure/results.json
      - name: Preserve assertion and screenshot failures through cleanup
        env:
          NGNE_BROWSER_HEADLESS: 0
          NGNE_WEBGPU_ADAPTER: swiftshader
        run: |
          if NGNE_BROWSER_INJECT_FAILURE=1 NGNE_BROWSER_INJECT_SCREENSHOT_FAILURE=1 NGNE_BROWSER_ARTIFACT_DIR=.test-output/browser-diagnostic-failure xvfb-run -a npm run test:browser; then
            echo "Intentional diagnostic failure unexpectedly passed"
            exit 1
          fi
          jq -e '.status == "failed" and (.failures | any(contains("intentional CI assertion failure"))) and (.failures | any(contains("NGNE.invalidScreenshotCommand"))) and ([.cleanup[].status] | all(. == "passed"))' .test-output/browser-diagnostic-failure/results.json
      - name: Reject successful validation when cleanup fails
        env:
          NGNE_BROWSER_HEADLESS: 0
          NGNE_WEBGPU_ADAPTER: swiftshader
        run: |
          if NGNE_BROWSER_INJECT_CLEANUP_FAILURE=1 NGNE_BROWSER_ARTIFACT_DIR=.test-output/browser-cleanup-failure xvfb-run -a npm run test:browser; then
            echo "Intentional cleanup failure unexpectedly passed"
            exit 1
          fi
          jq -e '.status == "failed" and (.passed | length > 0) and (.failures | any(contains("intentional CI cleanup failure"))) and ([.cleanup[] | select(.resource != "controlled cleanup failure") | .status] | all(. == "passed"))' .test-output/browser-cleanup-failure/results.json
      - name: Run WebGPU browser integration
        env:
          NGNE_BROWSER_HEADLESS: 0
          NGNE_WEBGPU_ADAPTER: swiftshader
        run: xvfb-run -a npm run test:browser
      - name: Run installed content at root and nested bases
        env:
          NGNE_BROWSER_HEADLESS: 0
          NGNE_WEBGPU_ADAPTER: swiftshader
        run: xvfb-run -a node tests/installed-browser.mjs
      - name: Upload browser integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration
          path: |
            .test-output/browser*
            .test-output/installed-content/*.json
            .test-output/installed-content/*.log
            .test-output/installed-content/browser/
            .test-output/installed-content/consumer/vendor/
            .test-output/installed-content/consumer/dist/
            .test-output/installed-content/consumer/dist-nested/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload showcase
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v4
