name: Prepare release candidate

# Initial publication is manual after artifact review and explicit approval.
# This workflow creates neither a Git tag nor an npm release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Intended v<package version> tag (not created by this workflow)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PREPARATION_MANIFEST: out/runs/release-package/evidence/manifest.json
      NGNE_BROWSER_HEADLESS: "0"
      NGNE_WEBGPU_ADAPTER: swiftshader
      NGNE_BROWSER_ARTIFACT_DIR: .test-output/release-browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind source, package and intended tag
        run: node tooling/commands/release-candidate.ts bind
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck:tooling
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:browser
      - name: Prepare package once
        run: npm run prepare:package -- --output out/runs/release-package
      - name: Validate exact preparation
        run: npm run check:prepared -- --manifest "$PREPARATION_MANIFEST"
      - name: Install software WebGPU presentation dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Verify browser transport
        run: xvfb-run -a npm run check:browser-transport
      - name: Verify installed engine at root and nested bases
        run: xvfb-run -a npm run verify:installed -- --manifest "$PREPARATION_MANIFEST"
      - name: Verify packaged previewer
        run: xvfb-run -a npm run verify:preview -- --manifest "$PREPARATION_MANIFEST"
      - name: Verify browser integration
        run: xvfb-run -a npm run test:browser
      - name: Recheck preparation integrity after verification
        run: npm run check:prepared -- --manifest "$PREPARATION_MANIFEST"
      - name: Assemble immutable candidate for review
        run: node tooling/commands/release-candidate.ts assemble
      - name: Retain diagnostic evidence (not publication approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/release-source.json
            out/runs/**/evidence/**
            .test-output/release-browser/**
            !**/node_modules/**
            !**/.npm-cache/**
            !**/work/**
            !**/profile/**
            !**/*.tgz
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload candidate only after all checks pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release-candidate/
          if-no-files-found: error
